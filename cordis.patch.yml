# Complete service composition: no default Web, SDK, shell, or model bundle.
- insert:
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      disabled: !!js process.env.MIO_PROVIDERS_DATABASE_URL !== undefined || process.env.MIO_MODEL_PROVIDER !== 'deepseek-official'
      config:
        apiKeyEnv: MIO_MODEL_API_KEY
        streamIdleTimeoutMs: 30000
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none
    - id: mio-kernel
      name: '@mio/plugin/kernel'
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.MIO_HOST ?? '127.0.0.1'
        port: !!js Number(process.env.MIO_PORT ?? 4310)
    - id: mio-foundation
      name: '@mio/plugin'
      inject: [mioKernel]
      config:
        tokenEnv: MIO_API_TOKEN
        allowedOrigins: !!js JSON.parse(process.env.MIO_ALLOWED_ORIGINS ?? '[]')
